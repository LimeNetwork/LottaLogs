name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      should_release: ${{ steps.tag.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from build.gradle.kts
        id: read
        run: |
          version=$(grep -E '^version\s*=' build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$version" ]; then
            echo "::error::Could not parse version from build.gradle.kts"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Detected version: $version"

      - name: Check if tag already exists
        id: tag
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          tag="v${VERSION}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists — skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${tag} does not exist — proceeding."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Locate jar
        id: jar
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          jar="build/libs/LottaLogs-${VERSION}.jar"
          if [ ! -f "${jar}" ]; then
            echo "::error::Expected jar not found at ${jar}"
            echo "Contents of build/libs/:"
            ls -la build/libs/ || true
            exit 1
          fi
          echo "path=${jar}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          JAR: ${{ steps.jar.outputs.path }}
        run: |
          tag="v${VERSION}"
          gh release create "${tag}" \
            --title "${tag}" \
            --generate-notes \
            --target "${{ github.sha }}" \
            "${JAR}"
